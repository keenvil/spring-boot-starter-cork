name: Publish to GitHub Packages

on:
  push:
    # "development" quedo obsoleto tras la regularizacion de branching de hoy (2026-09-23,
    # sin commits desde hace 5 dias) -- el release real pasa a disparar solo con "main",
    # mismo patron que el resto de la flota (auto-tag en push a main). No se agrega
    # "testing" a proposito: no queremos publicar una version intermedia del paquete
    # por cada promocion a staging, solo cuando algo realmente llega a producir.
    branches: [ main ]
  # Agregado 2026-09-23: el push a main que promovio el fix de 401/500 no disparo el
  # evento de push (mismo fenomeno visto hoy en otro repo -- GitHub deja de generar
  # eventos para un ref puntual sin causa clara). Con esto se puede disparar el publish
  # a mano desde la UI/gh cli sin depender de un push nuevo si vuelve a pasar.
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
          server-id: cork
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN

      - name: Publish to GitHub Packages
        run: mvn --batch-mode deploy -DskipTests -Dcheckstyle.skip=true
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
