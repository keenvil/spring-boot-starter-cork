name: Publish to GitHub Packages

on:
  push:
    # TEMPORAL: feature/java-21-refactor agregada solo para publicar 4.0.5
    # (fix de referencia circular en MultitenancyAutoConfiguration) sin
    # mergear toda la migracion a Java 21 a development todavia. Se revierte
    # apenas termine de publicar.
    branches: [ development, feature/java-21-refactor ]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
          server-id: cork
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN

      - name: Publish to GitHub Packages
        run: mvn --batch-mode deploy -DskipTests -Dcheckstyle.skip=true
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
