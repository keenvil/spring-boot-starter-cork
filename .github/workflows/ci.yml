name: CI

on:
  pull_request:
    branches: [ develop, testing ]
  push:
    branches: [ 'feature/**' ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
      - name: Compile
        run: mvn --batch-mode compile -Dcheckstyle.skip=true

  test:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
      # verify incluye el check de JaCoCo: falla si la cobertura de lineas baja de 70% ([TEST-COVERAGE-70]).
      - name: Test
        run: mvn --batch-mode verify -Dcheckstyle.skip=true

      - name: Cobertura (JaCoCo)
        if: always()
        run: |
          f=target/site/jacoco/jacoco.csv
          if [ ! -f "$f" ]; then echo "Sin reporte de cobertura" >> "$GITHUB_STEP_SUMMARY"; exit 0; fi
          awk -F, -v f="$f" 'NR>1{mi+=$4;ci+=$5;bm+=$6;bc+=$7;ml+=$8;cl+=$9} END{
            printf "### Cobertura\n\n| Instrucciones | Ramas | Lineas |\n|---|---|---|\n| %.1f %% | %.1f %% | %.1f %% |\n\nFuente: `%s`\n",
              100*ci/(ci+mi), (bc+bm ? 100*bc/(bc+bm) : 0), 100*cl/(cl+ml), f }' "$f" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Publicar reporte de cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cobertura-jacoco
          path: target/site/jacoco/
          if-no-files-found: ignore
